<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="/AdminPanel/navbars/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="manage_users.css"> <!-- Custom CSS -->
</head>
<body>

    <!-- Placeholder for navbar and sidebar -->
    <div id="navbar-container"></div>

    <div id="main">
        <h1>Manage Users</h1>
        <p>Admins can view and delete users.</p>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Search by name, user_id...">
            <button id="search-btn">Search</button>
        </div>

        <table class="user-list">
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Created At</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <!-- User rows will be loaded here dynamically -->
                <tbody id="course-table-body">
                    <tr>
                        <td>101</td>
                        <td>John Doe</td>
                        <td>john.doe@example.com</td>
                        <td>2024-03-01 10:30 AM</td>
                        <td>Admin</td>
                        <td>
                            <button class="delete-btn" data-user-id="101">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>102</td>
                        <td>Jane Smith</td>
                        <td>jane.smith@example.com</td>
                        <td>2024-03-02 03:15 PM</td>
                        <td>Instructor</td>
                        <td>
                            <button class="delete-btn" data-user-id="102">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>103</td>
                        <td>David Johnson</td>
                        <td>david.johnson@example.com</td>
                        <td>2024-03-03 07:45 AM</td>
                        <td>Student</td>
                        <td>
                            <button class="delete-btn" data-user-id="103">Delete</button>
                        </td>
                    </tr>
                </tbody>
                
            </tbody>
        </table>
    </div>

    <script src="manage_users.js"></script> <!-- Custom JavaScript -->
</body>
</html>
