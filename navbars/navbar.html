    <script>
    document.addEventListener("DOMContentLoaded", () => {
        function highlightActivePage() {
            const links = document.querySelectorAll(".sidenav a, .navbar .nav-right a");
            const currentPath = window.location.pathname;

            console.log("Current Path:", currentPath); // Debugging

            links.forEach(link => {
                const linkPath = link.getAttribute("href");

                console.log("Checking:", linkPath); // Debugging

                if (currentPath.includes(linkPath) && linkPath !== "#") {
                    link.classList.add("active");
                    console.log("Matched:", linkPath); // Debugging
                } else {
                    link.classList.remove("active");
                }
            });
        }

        highlightActivePage(); // Run on page load
    });
    </script>
